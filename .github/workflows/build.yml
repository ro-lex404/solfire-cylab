name: build-solana
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      # Use a dedicated action to install Solana CLI and cargo-build-sbf
      - name: Setup Solana CLI
        uses: metaDAOproject/setup-solana@v1.2
        with:
          solana-cli-version: 1.10.25

      - name: Build Solana Program
        run: cargo build-sbf --tools-version v1.41

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solve-so
          path: target/deploy/solve.so