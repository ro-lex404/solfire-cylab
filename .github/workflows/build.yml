name: build-solana-docker
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Locate cargo inside Docker
        run: |
          docker run --rm \
            --entrypoint /bin/bash \
            solanalabs/solana:v1.10.25 \
            -c "find / -name 'cargo*' -type f 2>/dev/null"

      - name: Build inside Solana v1.10.25 Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/code -w /code \
            --ulimit nofile=1000000:1000000 \
            --security-opt seccomp=unconfined \
            --entrypoint /bin/bash \
            solanalabs/solana:v1.10.25 \
            -c "/usr/bin/cargo-build-bpf"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solve-so
          path: target/deploy/solve.so