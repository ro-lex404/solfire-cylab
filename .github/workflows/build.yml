name: build-solana-docker
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build inside Solana v1.10.25 Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/code -w /code \
            solanalabs/solana:v1.10.25 \
            cargo build-bpf

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solve-so
          path: target/deploy/solve.so