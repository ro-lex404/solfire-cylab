name: build-solana
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Setup Solana CLI
        uses: solana-fm/setup-solana@v1
        with:
          solana-version: 1.14.27
          cache: true

      - name: Build Solana Program
        run: cargo build-sbf

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: solve-so
          path: target/deploy/solve.so